name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Linting
  # Catches static style issues and syntax errors cheaply before running slower tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check app/

  # Job 2: Testing
  # Verifies logic and correctness. Only runs if linting passes successfully.
  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      # You must add these keys in GitHub Repo -> Settings -> Secrets and variables -> Actions
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  # Job 3: Deploy
  # Triggers a deployment securely. Only triggers if both lint and test stages passed.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Exclusively restrict this deployment trigger to the main branch
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy API to Render
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          echo "Triggering Render API deployment..."
          curl -X POST -fail "$RENDER_DEPLOY_HOOK_API"
          
      - name: Deploy Streamlit UI to Render
        env:
          RENDER_DEPLOY_HOOK_UI: ${{ secrets.RENDER_DEPLOY_HOOK_UI }}
        run: |
          echo "Triggering Render UI deployment..."
          curl -X POST -fail "$RENDER_DEPLOY_HOOK_UI"

  # Job 4: Deploy to GCP Cloud Run
  deploy-gcp:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    # Required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/453216420068/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@agentic-rag-platform-495720.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push API Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/agentic-rag-platform-495720/enterprise-rag-repo/api:${{ github.sha }} -f docker/Dockerfile .
          docker push asia-south1-docker.pkg.dev/agentic-rag-platform-495720/enterprise-rag-repo/api:${{ github.sha }}

      - name: Deploy API to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: enterprise-rag-api
          image: asia-south1-docker.pkg.dev/agentic-rag-platform-495720/enterprise-rag-repo/api:${{ github.sha }}
          region: asia-south1
          flags: --service-account=rag-api@agentic-rag-platform-495720.iam.gserviceaccount.com
          env_vars: |
            GCP_USE_VERTEX_AI=True
            GCP_PROJECT_ID=agentic-rag-platform-495720
            GCP_REGION=asia-south1
          secrets: |
            GEMINI_API_KEY=gemini-api-key:latest
            GROQ_API_KEY=groq-api-key:latest
            DATABASE_URL=database-url:latest
            UPSTASH_REDIS_REST_URL=upstash-redis-rest-url:latest
            UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token:latest
            QDRANT_URL=qdrant-url:latest
            QDRANT_API_KEY=qdrant-api-key:latest
            LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest
            LANGFUSE_SECRET_KEY=langfuse-secret-key:latest
            JINA_API_KEY=jina-api-key:latest

      - name: Build and Push Streamlit UI Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/agentic-rag-platform-495720/enterprise-rag-repo/ui:${{ github.sha }} -f docker/Dockerfile.streamlit .
          docker push asia-south1-docker.pkg.dev/agentic-rag-platform-495720/enterprise-rag-repo/ui:${{ github.sha }}

      - name: Deploy UI to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: enterprise-rag-ui
          image: asia-south1-docker.pkg.dev/agentic-rag-platform-495720/enterprise-rag-repo/ui:${{ github.sha }}
          region: asia-south1
          flags: --service-account=rag-api@agentic-rag-platform-495720.iam.gserviceaccount.com
          env_vars: |
            BACKEND_URL=${{ steps.deploy-api.outputs.url }}

